[project]
name = "mpci-bench"
version = "1.0.0"
description = "MPCI-Bench: Multimodal Pairwise Contextual Integrity Benchmark for VLM Agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC BY 4.0"}
keywords = ["benchmark", "privacy", "contextual integrity", "multimodal", "VLM", "LLM agents"]
dependencies = [
    "accelerate>=1.12.0",
    "anthropic>=0.7.0",
    "bitsandbytes>=0.45.5",
    "black>=25.12.0",
    "chromadb>=1.3.7",
    "fire>=0.7.1",
    "langchain==0.0.277",
    "matplotlib>=3.10.8",
    "numpy>=1.26.4",
    "openai>=1.99.1",
    "procoder",
    "pydantic>=2.0",
    "python-dotenv==1.0.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "statsmodels>=0.14.6",
    "streamlit>=1.52.1",
    "tiktoken>=0.6.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.45.0",
    "qwen-vl-utils>=0.0.8",
    "wikipedia>=1.4.0",
    "vllm>=0.12.0",
]

[project.scripts]
mpci-evaluate = "evaluate:main"
mpci-validate = "mpci_bench.validate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["api", "evaluate"]

[tool.setuptools.packages.find]
include = ["mpci_bench*"]

[tool.uv.sources]
procoder = { git = "https://github.com/dhh1995/PromptCoder.git" }
